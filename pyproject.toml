[project]
name = "agent-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel", email = "avilacardenadaniel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.15",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
]

[project.scripts]
agent-langgraph = "agent_langgraph:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "ipykernel>=7.3.0",
    "langgraph-cli[inmem]>=0.4.31",
]
[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
